# Main GRUB config for RPM build mode

# Set the prefix back to the correct value after we're done with memdisk
set prefix=($root)/flatcar/grub

# Load required modules for partition and filesystem access
insmod part_gpt
insmod btrfs
insmod ext2

# Load any and all video drivers.
# Required under UEFI to boot Linux with a working console.
insmod all_video

# Default menuentry id and boot timeout
set default="flatcar"
# Retry default boot entry - this will decrement the gpt tries counter and
# switch to previous entry when all attempts are exhausted.
set fallback="0 0 0"
set timeout=2

# Default kernel args for root filesystem, console, and ACL.
set linux_root="root=LABEL=ROOT"
set linux_console=""
set first_boot=""
set randomize_disk_guid=""
set oem_id=""

# Anything else the OEM adds should use this variable.
set linux_append=""

set secure_boot="0"

if [ "$net_default_server" != "" ]; then
   smbios --type 1 --get-uuid 8 --set uuid
   smbios --type 1 --get-string 7 --set serial
   set mac=$net_default_mac
   # Re-DHCP as grub to get the API endpoint
   net_bootp $net_default_interface
   # This is awful, but grub doesn't support a nice way to do this
   for i in "$net_efinet0_dhcp_boot_file" "$net_efinet1_dhcp_boot_file" "$net_efinet2_dhcp_boot_file" "$net_efinet3_dhcp_boot_file" "$net_efinet4_dhcp_boot_file" "$net_efinet5_dhcp_boot_file" "$net_efinet6_dhcp_boot_file" "$net_efinet7_dhcp_boot_file" "$net_efinet8_dhcp_boot_file" "$net_efinet9_dhcp_boot_file"; do
      if [ "$i" != "" ]; then
          set endpoint="$i"
          break
      fi
   done
   if [ "$endpoint" != "" ]; then
      set url="${endpoint}?uuid=$uuid&serial=$serial&mac=$mac"
      if [ "$gpgpubkey" != "" ]; then
         set check_signatures="enforce"
      fi
      configfile $url
   fi
fi

# Search for the OEM partition, load additional configuration if found.
if [ "$secure_boot" = "0" ]; then
   # Using the standard fs-label search to find the OEM partition, as we don't have the custom Flatcar grub patch.
   search --no-floppy --set oem --label OEM --hint "$root"
   
   if [ -n "$oem" -a -f "($oem)/grub.cfg" ]; then
       source "($oem)/grub.cfg"
   fi
fi

# Determine if this is a first boot.
if [ -f "($root)/flatcar/first_boot" ]; then
    set first_boot="flatcar.first_boot=detected"
fi

set oem=""
if [ -n "$oem_id" ]; then
    set oem="flatcar.oem.id=$oem_id"
fi

# If no specific console has been set by the OEM then select based on
# platform, most systems use vga text as primary and ttyS0 as secondary.
if [ -z "$linux_console" ]; then
    if [ "$grub_platform" = efi ]; then
        if [ "$grub_cpu" = arm64 ]; then
            set linux_console="console=ttyAMA0,115200n8"
        else
            # set linux_console="console=ttyS0,115200n8 console=tty0"
            set linux_console="console=tty0 console=tty1 console=ttyS0"
        fi
    fi
fi

set extra_options=""
if [ "$grub_cpu" = arm64 ]; then
	set extra_options="acpi=force"
fi

set suf=""

# Assemble the options applicable to all the kernels below
set linux_cmdline="rootflags=rw mount.usrflags=ro consoleblank=0 $linux_root $linux_console $first_boot $randomize_disk_guid $extra_options $oem $linux_append"

# Re-implement grub_abort() since no command exposes it.
function abort {
    echo
    echo "Aborted. Press enter to exit GRUB."
    read anything
    exit
}

# Azure Linux kernel path - injected at build time
# @@KERNEL@@ is replaced with the actual kernel path during image build
set azl_kernel="@@KERNEL@@"

# Consider deleting the no-verity flow
# dm-verity hash for /usr partition (injected at build time, empty if verity disabled)
# systemd-veritysetup-generator reads usrhash= to create /dev/mapper/usr
set verity_usrhash="@@USRHASH@@"

# Azure Linux GRUB doesn't have gptprio.next command
# Boot directly from USR-A partition. A/B updates would require custom handling.
# USR-A partition UUID from disk_layout.json
set usr_a_uuid="7130c94a-213a-4e5a-8e26-6cce9662f132"
set usr_b_uuid="e03dd35c-7c2d-4a47-b3fe-27f15780a57c"

# Verity hash offset: fs_blocks * fs_block_size = 260094 * 4096 = 1065345024
# The hash tree is stored at the end of the USR partition after the filesystem data
set verity_hash_offset="1065345024"

set verity_cmdline="@@MOUNTUSR@@ usrhash=$verity_usrhash systemd.verity_usr_data=PARTUUID=$usr_a_uuid systemd.verity_usr_hash=PARTUUID=$usr_a_uuid systemd.verity_usr_options=hash-offset=$verity_hash_offset,panic-on-corruption"

menuentry "Azure Container Linux default" --id=flatcar --unrestricted {
    linux$suf $azl_kernel $verity_cmdline $linux_cmdline
    initrd$suf /flatcar/initramfs-a.img
}

# Note: USR-A and USR-B entries below don't support dm-verity.
# They are for recovery/debugging without verified boot
menuentry "Azure Container Linux USR-A" --id=flatcar-a {
   linux$suf $azl_kernel mount.usr=PARTUUID=$usr_a_uuid $linux_cmdline
   initrd$suf /flatcar/initramfs-a.img
}

menuentry "Azure Container Linux USR-B" --id=flatcar-b {
   linux$suf $azl_kernel mount.usr=PARTUUID=$usr_b_uuid $linux_cmdline
   initrd$suf /flatcar/initramfs-b.img
}
