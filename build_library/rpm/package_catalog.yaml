# Package catalog mapping Flatcar/Portage packages to Azure Linux RPMs.
#
# Format:
#   portage-package: rpm-name         — single RPM replacement
#   portage-package:                  — multiple RPM replacements
#     - rpm-name-1
#     - rpm-name-2
#   portage-package: SKIP             — not installed in RPM mode
#
# This file is the source of truth. package_catalog.sh loads it via yq.

packages:
  # Kernel - always from Azure Linux in RPM mode
  sys-kernel/coreos-kernel: kernel
  sys-kernel/coreos-modules: kernel

  # Initramfs generator - needed for Azure Linux kernel (no embedded initramfs)
  sys-kernel/dracut: dracut

  # Base system packages
  # Note: for now, we're using systemd to pull in packages that aren't sent
  # through the catalog.
  sys-apps/systemd:
    - systemd
    - systemd-journal-remote
    - libselinux-utils
    - selinux-policy
    - policycoreutils
    - ca-certificates
  sys-libs/systemd-libs: systemd-libs
  sys-apps/systemd-networkd: systemd-networkd
  net-misc/systemd-networkd: systemd-networkd
  sys-apps/baselayout: SKIP
  sys-apps/filesystem: filesystem
  sys-apps/coreutils: coreutils
  sys-apps/util-linux: util-linux
  sys-apps/shadow: shadow-utils
