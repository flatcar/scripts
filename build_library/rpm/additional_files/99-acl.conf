# Dracut configuration for RPM build mode
# Use tmpdir in /tmp which has proper permissions
tmpdir="/tmp"
# Skip modules that require special hardware or are not needed for VM boot
omit_dracutmodules+=" plymouth bluetooth nfs iscsi fcoe fcoe-uefi nbd multipath lvm "
# Ensure we have the modules needed for basic boot (Azure Linux module names)
add_dracutmodules+=" kernel-modules rootfs-block base fs-lib shutdown "
# Force inclusion of systemd for proper boot via dracut-systemd
# systemd-udevd installs libudev.so which is required by systemd-veritysetup
add_dracutmodules+=" systemd systemd-initrd systemd-udevd udev-rules dracut-systemd "
# Include dm (device-mapper), crypt, and systemd-veritysetup for dm-verity support
# systemd-veritysetup-generator reads usrhash= from kernel cmdline for /usr verity
add_dracutmodules+=" dm crypt systemd-veritysetup "
# Include ignition module for first-boot configuration
# Note: ignition's check() returns 255 so it must be explicitly added
add_dracutmodules+=" ignition "
# Force inclusion of storage drivers for VMs (virtio, SCSI, SATA, NVMe)
drivers+=" virtio virtio_pci virtio_blk virtio_scsi virtio_ring "
drivers+=" sd_mod sr_mod sg ahci ata_piix ata_generic libata "
drivers+=" nvme nvme_core "
# Force inclusion of filesystem drivers
drivers+=" ext4 vfat btrfs "
# Force inclusion of device-mapper and dm-verity kernel modules
drivers+=" dm_mod dm_verity "
# Install additional binaries and libraries that may be needed
install_items+=" /usr/sbin/blkid /usr/sbin/fsck /usr/sbin/fsck.ext4 /usr/sbin/e2fsck "
install_items+=" /usr/lib64/libcom_err.so.2 /usr/lib64/libe2p.so.2 /usr/lib64/libext2fs.so.2 "
# Device-mapper tools (dmsetup is required for dracut dm module)
install_items+=" /usr/sbin/dmsetup "
# Cryptsetup libraries (required for veritysetup and crypt module)
install_items+=" /usr/lib/libcryptsetup.so.12 /usr/lib64/libcryptsetup.so.12 "
install_items+=" /usr/sbin/cryptsetup "
# dm-verity tool
install_items+=" /usr/sbin/veritysetup "
# systemd-veritysetup binary (dracut should include it via module, but be explicit)
install_items+=" /usr/lib/systemd/systemd-veritysetup "
# Include verity device timing drop-ins in initramfs
# These ensure udev has finished device enumeration before verity setup runs
install_items+=" /usr/lib/systemd/system/dev-mapper-usr.device.d/no-job-timeout.conf "
# Include flatcar-tmpfiles stub needed by bootengine's initrd-setup-root
install_items+=" /usr/sbin/flatcar-tmpfiles "
# Include setfiles stub for SELinux-disabled systems
install_items+=" /usr/sbin/setfiles /usr/sbin/setfiles-stub "
# Don't strip binaries
do_strip="no"
# Disable early microcode (not needed in VM)
early_microcode="no"
# Compress with zstd for faster decompression and smaller initramfs size
compress="zstd"
# Not host-only - include all drivers for portability
hostonly="no"
