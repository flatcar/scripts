name: Keep Gentoo submodule updated
on:
  schedule:
    - cron: '0 4 * * 0-4'
  workflow_dispatch:

jobs:
  keep-gentoo-updated:
    runs-on: ubuntu-latest
    steps:
      - name: Check out scripts
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.BOT_PR_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}
          path: scripts
          sparse-checkout: |
            .gitmodules
            .github/workflows/common.sh
          sparse-checkout-cone-mode: false
      - name: Update Gentoo submodule
        id: update-gentoo
        working-directory: scripts
        env:
          WORK_SCRIPTS_DIR: "${{ github.workspace }}/scripts"
        run: |
          set -euo pipefail
          source .github/workflows/common.sh
          prepare_git_repo
          submodule=sdk_container/src/third_party/gentoo
          url=$(git config --file .gitmodules --get "submodule.${submodule}.url")
          branch=$(git config --file .gitmodules --get "submodule.${submodule}.branch")
          read -r latest_commit _ < <(git ls-remote --exit-code "${url}" "refs/heads/${branch}")
          short_commit=${latest_commit:0:12}
          git update-index --cacheinfo "160000,${latest_commit},${submodule}"
          if git diff --cached --quiet -- "${submodule}"; then
              echo 'UPDATE_NEEDED=0' >>"${GITHUB_OUTPUT}"
              exit 0
          fi
          git commit --signoff -m "gentoo: Update to ${short_commit}"
          previous_branch="buildbot/update-gentoo-submodule"
          default_branch="${{ github.event.repository.default_branch }}"
          if git fetch --no-tags --no-recurse-submodules --depth=1000 origin \
              "+refs/heads/${previous_branch}:refs/remotes/origin/${previous_branch}"; then
              git fetch --no-tags --no-recurse-submodules --deepen=1000 origin "${default_branch}"
              additional_commits=$(git rev-list --reverse --no-merges \
                  "origin/${default_branch}..origin/${previous_branch}" -- ":^:${submodule}")
              if [[ -n "${additional_commits}" ]]; then
                  mapfile -t commits <<< "${additional_commits}"
                  if ! git cherry-pick "${commits[@]}"; then
                      echo '::warning::Could not replay additional commits; keeping only the Gentoo submodule update.'
                      git cherry-pick --abort
                  fi
              fi
          fi
          cleanup_repo
          echo 'UPDATE_NEEDED=1' >>"${GITHUB_OUTPUT}"
          echo "LATEST_COMMIT=${latest_commit}" >>"${GITHUB_OUTPUT}"
          echo "SHORT_COMMIT=${short_commit}" >>"${GITHUB_OUTPUT}"
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        if: steps.update-gentoo.outputs.UPDATE_NEEDED == 1
        with:
          token: ${{ secrets.BOT_PR_TOKEN }}
          path: scripts
          branch: buildbot/update-gentoo-submodule
          delete-branch: true
          title: Update gentoo submodule to ${{ steps.update-gentoo.outputs.SHORT_COMMIT }}
          body: Update `sdk_container/src/third_party/gentoo` to flatcar-hub/gentoo@${{ steps.update-gentoo.outputs.LATEST_COMMIT }}.
          labels: auto-ci,jenkins-ci,main
