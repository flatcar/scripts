        reason: Test requires hostname control that conflicts with Azure instance-level hostname handling
  - name: linux.ntp
    exceptions:
      - platforms: [azure]
        reason: Test starts a local NTP server, so it is not cloud-environment coverage
      - imageVariants: [acl-t]
        reason: |
          Test hardcodes systemd-timesyncd (mantle kola/tests/misc/ntp.go
          waits for "Synchronized to time server"); acl-t ships chronyd,
          whose unit conflicts out timesyncd (upstream chronyd.service:
          Conflicts=systemd-timesyncd.service). Daemon liveness is
          covered by acl.basic/ServicesActive; a chrony-native sync test
          (chronyc tracking) is tracked as a follow-up.

  - name: sysext.custom-docker.sysext
    exceptions:
      - imageVariants: [acl-t]
        reason: |
          The test swaps in freshly-baked `docker` + `containerd`
          sysexts and verifies docker starts working; on acl-t there is
          no docker baseline and containerd is an RPM in the
          verity-protected /usr rather than a swappable sysext, so the
          swap scenario does not exist.
  - name: sysext.disable-containerd
    exceptions:
      - imageVariants: [acl-t]
        reason: |
          The test masks the embedded `containerd` sysext and asserts
          /usr/bin/containerd disappears; on acl-t containerd is the
          moby-containerd RPM baked into the verity-protected /usr, so
          masking is a no-op and the binary can never be absent.
  - name: sysext.disable-docker
    exceptions:
      - imageVariants: [acl-t]
        reason: |
          The test masks the standalone `docker` sysext and asserts
          /usr/bin/docker is absent; acl-t never carries a docker sysext
          (docker is not part of the product), so there is nothing to
          mask and the scenario is vacuous.
  - name: sysext.simple
    exceptions:
      - imageVariants: [acl-t]
        reason: |
          The test merges a synthetic Ignition-provided extension via
          systemd-sysext — no shipped sysext is involved; exempted
          because sysext-delivered content is outside acl-t's supported
          surface (everything comes from signed RPMs). Candidate to
          re-enable if generic sysext support on acl-t becomes a
          requirement.

