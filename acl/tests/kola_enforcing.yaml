# kola_enforcing.yaml — Enforced kola tests with structured exception rules.
#
# This is the source of truth for which kola tests are enforced. It is consumed
# directly by evaluate_test_results.sh with platform/arch/bootloader context.
#
# Each entry is a test name prefix. Tests matching any prefix must pass
# unless an exception rule applies to the current build context.
#
# Exception rules (all fields optional — omitted fields match anything):
#   platforms:         [qemu, azure]
#   architectures:     [amd64, aarch64]
#   bootloader:        [grub, uki]
#   imageVariants:     [acl, acl-t]
#   reason:            human-readable explanation
#
# Logic:
#   - Within a single rule, fields combine with AND (all must match).
#   - Across rules, they combine with OR (any matching rule allows failure).
#   - A test with no exceptions is always enforced.
#   - imageVariants values match exactly ('acl' never matches 'acl-t').
#   - A rule whose ONLY constraint is imageVariants also drops the test
#     from kola selection on that variant (it can never pass there, so it
#     is not run at all). A rule that combines imageVariants with
#     platforms/architectures/bootloader keeps the test selected and only
#     forgives failures at evaluation where every key matches.

version: 1

tests:
  - name: acl.basic
  - name: acl.etcd-member.discovery
    exceptions:
      - platforms: [qemu]
        architectures: [aarch64]
        reason: 3-node etcd cluster on TCG-emulated arm64 races systemd's DefaultDeviceTimeoutSec for /dev/disk/by-label/OEM; tracked by the OEM fsck conditional dropin work
      - platforms: [azure]
        reason: Azure version depends on discovery.etcd.io, which is unmaintained.
      - imageVariants: [acl-t]
        reason: |
          The test's etcd server runs in a docker container
          (etcd-member.service via etcd-wrapper), and acl-t has no
          docker daemon — the standalone `docker` sysext is not carried
          and docker has no RPM replacement (same as docker.*) — so no
          etcd server can start for the test to drive.

  - name: acl.flannel.udp
    exceptions:
      - architectures: [aarch64]
        reason: Flannel UDP coverage is registered only for amd64
      - platforms: [azure]
        reason: Azure version depends on discovery.etcd.io, which is unmaintained.
      - imageVariants: [acl-t]
        reason: |
          flanneld runs in a docker container (flanneld.service via
          flannel-wrapper) and the test drives docker on each node;
          acl-t has no docker daemon — the standalone `docker` sysext is
          not carried and docker has no RPM replacement (same as
          docker.*) — so flanneld cannot start.
  - name: acl.flannel.vxlan
    exceptions:
      - platforms: [qemu]
        architectures: [aarch64]
        reason: Flakiness on TCG-emulated arm64 in aclmain, failures due to slow device enumeration.
      - platforms: [azure]
        reason: Azure version depends on discovery.etcd.io, which is unmaintained.
      - imageVariants: [acl-t]
        reason: |
          flanneld runs in a docker container (flanneld.service via
          flannel-wrapper) and the test drives docker on each node;
          acl-t has no docker daemon — the standalone `docker` sysext is
          not carried and docker has no RPM replacement (same as
          docker.*) — so flanneld cannot start.

  - name: acl.internet
    exceptions:
      - platforms: [qemu]
        reason: Requires real network connectivity (Azure only)
      - platforms: [azure]
        reason: |
          TEMPORARY (AB#20102): DockerPing fails because kola Azure VMs no longer
          have a Public IP (mantle PR 27413), and Azure default outbound access
          does not SNAT ICMP. Revert once mantle/infra restores outbound ICMP
          (NSG-on-NIC keeping the PIP, or a NAT Gateway on the kola subnet).
      - imageVariants: [acl-t]
        reason: |
          All three subtests are non-viable on acl-t: DockerPing and
          DockerEcho need the docker daemon from the standalone `docker`
          sysext (same missing sysext as docker.*), and NTPDate needs
          the ntpdate binary (chrony is acl-t's time daemon; same reason
          as linux.ntp). Covered by the containerd and chrony follow-up
          tests tracked there.

