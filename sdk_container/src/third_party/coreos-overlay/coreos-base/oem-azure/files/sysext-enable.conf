# Enable symlinks for services delivered by the oem-azure sysext.
#
# These units are not visible during first-boot preset-all (which runs
# before systemd-sysext.service merges the overlay), so preset-all
# never creates the /etc admin symlinks.  Without them
# "systemctl is-enabled <unit>" reports "disabled".
#
# Using "L" (not "L+") so an admin can mask or redirect the symlink
# and have it stick across reboots — tmpfiles will not overwrite an
# existing path.
L /etc/systemd/system/multi-user.target.wants/chronyd.service - - - - /usr/lib/systemd/system/chronyd.service
L /etc/systemd/system/multi-user.target.wants/waagent.service  - - - - /usr/lib/systemd/system/waagent.service
