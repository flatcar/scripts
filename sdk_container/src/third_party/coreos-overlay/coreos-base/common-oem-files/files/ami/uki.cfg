# UKI addon args for AMI (AWS EC2).
# OEM ID is "ec2" because Afterburn/Ignition expects "ec2" for AWS.

ADDON_OEM_ID="ec2"
ADDON_CONSOLE_ARM64="console=tty1 console=ttyS0,115200n8 earlycon"
ADDON_APPEND="modprobe.blacklist=xen_fbfront net.ifnames=0 nvme_core.io_timeout=4294967295"
