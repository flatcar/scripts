# UKI addon args for Azure.

ADDON_CONSOLE_AMD64="console=tty1 console=ttyS0,115200n8 earlyprintk=ttyS0,115200"
ADDON_CONSOLE_ARM64="console=tty1 console=ttyAMA0,115200n8 earlycon=pl011,0xeffec000"

# Note: flatcar.autologin is intentionally omitted here unlike grub.cfg.frag.
# For GRUB mode, AgentBaker removes it at provisioning time via Ignition's
# kernelArguments.shouldNotExist (AgentBaker#7290). For UKI mode, the cmdline
# is baked into an immutable addon EFI binary that Ignition cannot modify,
# so it must be excluded at build time.
