#
# Bootable Flatcar disk assembled from the base sub-image; `--profile oem-<x>`
# builds one vendor's image instead. See README.md.

[Distribution]
# The SDK supplies packages; custom's no-op backend frees the mkosi-* helper
# names for tools/bin.
Distribution=custom
Architecture=x86-64

[Config]
# First release where an empty Initrds= skips the default initrd and the sandbox
# PATH keeps /usr/local/bin (emerge-${BOARD}).
MinimumVersion=27
# build_image's default built-in sysexts, baked in by 00-sysexts.sh. OEM
# profiles append their oem-<x>-sysext.
Dependencies=base
             containerd-flatcar-sysext
             docker-flatcar-sysext
PassEnvironment=FLATCAR_UPDATE_GROUP FLATCAR_IMAGE_PROFILE FLATCAR_SOURCE_BUILD
                FLATCAR_ALLOW_REMOTE_BINPKGS
                MODULES_SIGN_KEY MODULES_SIGN_CERT MODULE_SIGNING_KEY_DIR
                COREOS_OFFICIAL

[Output]
OutputDirectory=mkosi.output
Format=disk
# Without it ImageVersion lands in the file name; postoutput and CI need a
# stable path.
Output=image

[Build]
# %D: setting BuildSources= drops mkosi's default /work/src mount the hooks
# source lib/lib.sh from.
# /build: the board sysroot, writable for source builds; lib/lib.sh binds it
# back at /build, where the toolchain expects it. It is the real SDK sysroot, so
# `mkosi -ff` does not undo what hooks change there.
# distfiles, edb-dep: the SDK's DISTDIR and metadata cache (lib/lib.sh points
# portage at them); without them portage re-fetches sources and hangs
# regenerating metadata.
# module-signing-keys: kernel source builds create the key there and kmod
# packages sign with it.
BuildSources=%D:
             /build/:build
             /mnt/host/source/.cache/distfiles:distfiles
             /var/cache/edb/dep:edb-dep
             ${MODULE_SIGNING_KEY_DIR}:module-signing-keys
# FLATCAR_SOURCE_BUILD=1 builds each image's Packages= from source first, so
# local ebuild edits land without ./build_packages.
# FLATCAR_ALLOW_REMOTE_BINPKGS=0 stops a same-version remote binpkg from
# replacing a local edit that has no -rN bump.
# The cache doesn't hash Environment=, so toggling these needs `mkosi -ff`.
Environment=FLATCAR_UPDATE_GROUP=developer FLATCAR_IMAGE_PROFILE=prod
            FLATCAR_SOURCE_BUILD=1
            FLATCAR_ALLOW_REMOTE_BINPKGS=1
            # Bare names take the value from mkosi's own (sudo-preserved) env.
            MODULES_SIGN_KEY MODULES_SIGN_CERT MODULE_SIGNING_KEY_DIR
            COREOS_OFFICIAL

# The cache keys on Packages= and the PrepareScripts=, not on postinst.d/,
# mkosi.finalize or lib/: run `mkosi -ff` after changing those.
# It sits on the host bind mount: cp of security.selinux xattrs fails on the
# container's overlayfs.
Incremental=yes
CacheDirectory=/mnt/host/source/src/build/mkosi.cache
PackageCacheDirectory=/var/tmp/mkosi.pkgcache
# On overlayfs sub-image overlays fail to mount, and on another mount than
# mkosi.output the final rename becomes a copy that drops postoutput's disk GUID.
WorkspaceDirectory=/mnt/host/source/src/scripts/.mkosi.workspace
# tools/bin puts the mkosi-* helpers on the hook PATH. The rest are bound
# read-only into the sandbox: the ebuild repos, the SDK's package database
# (IDEPENDs such as glibc's locale-gen resolve against it), the version file
# common.sh reads, and the scripts tree build_library/* is called from.
ExtraSearchPaths=%D/tools/bin
                 /mnt/host/source/src/third_party/coreos-overlay
                 /mnt/host/source/src/third_party/gentoo
                 /var/db/pkg
                 /mnt/host/source/.repo
                 /mnt/host/source/src/scripts
# The sandbox has a bare /etc, so copy in what portage and the SDK scripts read
# (copying all of /etc fails on its dangling symlinks).
SandboxTrees=/etc/portage:/etc/portage
             /etc/debian_chroot:/etc/debian_chroot
             /etc/xml:/etc/xml
             /etc/sgml:/etc/sgml
             /etc/sandbox.conf:/etc/sandbox.conf
             /etc/sandbox.d:/etc/sandbox.d

[Content]
BaseTrees=%O/base
# build_library installs grub, the kernel and the ESP (mkosi.postinst.d/);
# bootengine is in the kernel, so there is no separate initrd.
Bootable=no
Bootloader=none
Initrds=
SELinuxRelabel=no

[Validation]
# /usr verity is Flatcar's own (hash in the kernel, mkosi.finalize). The key and
# cert sign the sysexts and confext and are their trust anchor.
Verity=disabled
VerityKey=mkosi.key
VerityCertificate=mkosi.crt

[Runtime]
# A running `mkosi vm` would otherwise lock mkosi.output/image, and `mkosi -f`
# wipes outputs before checking that lock.
Ephemeral=yes
