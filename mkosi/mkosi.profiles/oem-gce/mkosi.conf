# image_to_vm.sh --format=gce: the oem-gce sysext and the vm disk layout.

[Match]
# coreos-base/oem-gce is KEYWORDS=amd64 only.
Architecture=x86-64

[Include]
Include=%D/include/vm-layout.conf

[Config]
Dependencies=oem-gce-sysext

[Output]
Output=flatcar_production_gce_image

[Build]
Environment=FLATCAR_VM_TYPE=gce
