# Shared by every sysext sub-image: an overlay of base, built like build_sysext.
[Config]
Dependencies=base

[Output]
Format=sysext
Overlay=yes

[Content]
BaseTrees=%O/base
PrepareScripts=%D/tools/prepare.sh
PostInstallationScripts=%D/tools/save-pkgdb.sh
FinalizeScripts=%D/tools/sysext-mangle.sh
SELinuxRelabel=no
