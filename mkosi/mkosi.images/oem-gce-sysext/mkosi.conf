[Match]
# coreos-base/oem-gce is KEYWORDS=amd64 only.
Architecture=x86-64

[Include]
Include=%D/include/sysext.conf

[Output]
# Uncompressed like create_oem_sysexts' --compression=none: the OEM
# partition's btrfs compresses it.
Output=oem-gce
ImageId=oem-gce

[Content]
Packages=coreos-base/oem-gce
