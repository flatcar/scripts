# extra_sysexts.sh limits it to amd64.
[Match]
Architecture=x86-64

[Include]
Include=%D/include/extra-sysext.conf

[Output]
Output=flatcar-nvidia-drivers-535-open
ImageId=flatcar-nvidia-drivers-535-open

[Content]
Packages=x11-drivers/nvidia-drivers:0/535

[Build]
# USE flags from extra_sysexts.sh.
Environment="USE=kernel-open persistenced"
