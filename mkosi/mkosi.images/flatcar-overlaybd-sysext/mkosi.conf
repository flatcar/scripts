[Include]
Include=%D/include/extra-sysext.conf

[Output]
Output=flatcar-overlaybd
ImageId=flatcar-overlaybd

[Content]
Packages=sys-fs/overlaybd
         app-containers/accelerated-container-image

[Build]
# build_sysext's lz4hc default minus ztailpacking: with fragments it corrupts
# file tails in this tree (erofs-utils <= 1.9.4, fixed by b5be7cf).
Environment="SYSTEMD_REPART_MKFS_OPTIONS_EROFS=-zlz4hc,12 -C65536 -Efragments"
