# The base OS as a directory tree: the main image and the sysexts build on it.

[Output]
Format=directory
# Otherwise ImageVersion becomes part of the name.
Output=base

[Content]
# build_library provides the boot files; mkosi's would end up on the ESP.
Bootable=no
# Runs after the auto-detected mkosi.prepare next to this file.
PrepareScripts=%D/tools/prepare.sh
Packages=coreos-base/coreos
SELinuxRelabel=no
